[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contraste"
version = "0.1.0"
description = "Detecta en un diff las trampas de agentes de código: tests manipulados, casos especiales, igualdad comodín."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Raul Cruz Acosta (Esraderey)" }]
requires-python = ">=3.9"

[project.scripts]
contraste = "contraste:main"

[tool.setuptools]
py-modules = ["contraste"]
